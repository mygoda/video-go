# 本地开发用的 MySQL。仅供本机开发，密码是明摆着的占位符，不要用于任何共享环境。
services:
  mysql:
    image: mysql:8.4
    container_name: aigc-pool-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 本项目所有时间以 UTC 存取，容器时区必须跟着，否则 DATETIME(3) 会带上宿主机偏移。
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: aigc_pool
      MYSQL_USER: aigc
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - aigc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uaigc", "-pdevpass"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  aigc-mysql-data:
